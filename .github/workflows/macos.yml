name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS Apple Silicon DMG
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-macos --parallel 3

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Package application and dependency sources
        run: bash scripts/package-macos.sh build-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Purchase-Tracker-1.1.1-macOS-arm64
          path: |
            dist/BTC-Purchase-Tracker-1.1.1-macOS-arm64.dmg
            dist/BTC-Purchase-Tracker-1.1.1-macOS-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS dependency sources
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Purchase-Tracker-1.1.1-macOS-dependency-sources
          path: |
            dist/qtbase-everywhere-src-*.tar.xz
            dist/qtsvg-everywhere-src-*.tar.xz
          if-no-files-found: error
          retention-days: 30
